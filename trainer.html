<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>잠긴 문서</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
       background:#F7F7F5;color:#1A1A1A;min-height:100vh;display:flex;
       align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid #E5E5E2;padding:40px 32px;max-width:400px;width:100%}
  h1{font-size:18px;font-weight:700;margin-bottom:6px}
  p.sub{font-size:13.5px;color:#6E6E6E;margin-bottom:24px;line-height:1.6}
  input[type=password]{width:100%;border:1px solid #DDD;padding:14px;font-size:16px;
       font-family:inherit;min-height:48px}
  input[type=password]:focus{outline:none;border-color:#1A1A1A}
  .row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:13.5px;color:#3D3D3D}
  button{width:100%;border:0;background:#1A1A1A;color:#fff;padding:15px;font-size:15px;
       font-weight:600;font-family:inherit;cursor:pointer;min-height:50px}
  button:disabled{background:#999}
  .err{color:#B00020;font-size:13.5px;margin-top:12px;display:none;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h1>문서 B</h1>
  <p class="sub">이 문서는 암호화되어 있습니다. 비밀번호를 입력하면 이 기기에서만 열립니다.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="off" autofocus>
    <label class="row"><input type="checkbox" id="rem" checked> 이 기기에서 기억</label>
    <button id="go" type="submit">열기</button>
  </form>
  <div class="err" id="err">비밀번호가 맞지 않습니다.</div>
</div>

function b2a(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
function a2b(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function deriveKey(pw){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"])
  .then(function(k){return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b2a(SALT),iterations:ITERS,hash:"SHA-256"},k,
    {name:"AES-GCM",length:256},true,["decrypt"]);});
}
function decrypt(key){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(NONCE)},key,b2a(CT))
  .then(function(pt){return new TextDecoder().decode(pt);});
}
function writeDoc(html){ document.open(); document.write(html); document.close(); }
document.getElementById("f").addEventListener("submit",function(ev){
  ev.preventDefault();
  var pw=document.getElementById("pw").value;
  if(!pw)return;
  /* rewrite 후에는 이 DOM이 사라진다 — 체크 상태는 복호화 전에 캡처 */
  var remember=document.getElementById("rem").checked;
  var btn=document.getElementById("go");
  btn.disabled=true; btn.textContent="여는 중…";
  deriveKey(pw).then(function(key){
    return decrypt(key).then(function(html){
      var save = remember
        ? crypto.subtle.exportKey("raw",key).then(function(raw){
            try{localStorage.setItem(KEYNS,a2b(raw));}catch(e){}
          }).catch(function(){})
        : Promise.resolve();
      /* 키 저장을 rewrite보다 먼저 끝낸다 */
      return save.then(function(){ writeDoc(html); });
    });
  }).catch(function(){
    btn.disabled=false; btn.textContent="열기";
    document.getElementById("err").style.display="block";
    document.getElementById("pw").value=""; document.getElementById("pw").focus();
  });
});
/* 저장된 키가 있으면 자동 복호화 — 실패(재암호화됨) 시 키 폐기 후 폼 표시.
   ⚠️ 반드시 load 이후에 실행: 초기 파싱 중 document.open()은 무시되어
   문서가 교체되지 않고 이어 붙는다(폼+본문 공존 상태 실측). */
window.addEventListener("load",function(){
  var b64=null; try{b64=localStorage.getItem(KEYNS);}catch(e){}
  if(!b64)return;
  crypto.subtle.importKey("raw",b2a(b64),{name:"AES-GCM"},true,["decrypt"])
  .then(decrypt).then(writeDoc)
  .catch(function(){ try{localStorage.removeItem(KEYNS);}catch(e){} });
});
